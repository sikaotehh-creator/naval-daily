<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naval's Wisdom (Interactive)</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            /* 背景：深邃黑洞风格 */
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?ixlib=rb-4.0.3&auto=format&fit=crop&w=2013&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #e0e0e0;
            overflow: hidden; /* 防止手机端滑动出现白边 */
        }

        .card {
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.9);
            max-width: 650px;
            width: 90%;
            text-align: left;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* 顶部进度条装饰 */
        .progress-bar {
            position: absolute;
            top: 0; left: 0;
            height: 3px;
            background: linear-gradient(90deg, #b8860b, #ffd700);
            width: 100%; 
            border-radius: 16px 16px 0 0;
            opacity: 0.7;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .time-badge {
            font-family: 'Courier New', monospace;
            color: #666;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        .topic-tag {
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.5em;
            line-height: 1.6;
            margin: 0 0 25px 0;
            color: #f0f0f0;
            font-weight: 500;
            letter-spacing: 0.5px;
            min-height: 80px; /* 预留高度防止跳动 */
        }

        .quote-en {
            font-family: 'Georgia', serif;
            font-size: 1.1em;
            line-height: 1.6;
            color: #888;
            font-style: italic;
            margin-bottom: 0;
            min-height: 60px;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
        }

        .author {
            font-size: 0.85em;
            color: #555;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 按钮组样式 */
        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: #d4af37;
            color: #d4af37;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 手机适配 */
        @media (max-width: 600px) {
            .card { padding: 30px; }
            h1 { font-size: 1.3em; }
            .footer-row { flex-direction: column; gap: 20px; align-items: flex-end; }
            .nav-buttons { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="progress-bar"></div>
    <div class="meta-info">
        <span class="time-badge" id="card-index">...</span>
        <span class="topic-tag" id="category">...</span>
    </div>
    
    <h1 id="cn-text">载入智慧中...</h1>
    <p class="quote-en" id="en-text">Loading...</p>

    <div class="footer-row">
        <div class="nav-buttons">
            <button onclick="prevCard()">← PREV</button>
            <button onclick="nextCard()">NEXT →</button>
        </div>
        <div class="author">Naval Ravikant</div>
    </div>
</div>

<script>
    // --- 纳瓦尔宝典：50条扩充版数据库 ---
    const navalLibrary = [
        // 财富与杠杆
        { tag: "Wealth", cn: "追求财富，而不是金钱或地位。财富是指在你睡觉时仍能为你赚钱的资产。", en: "Seek wealth, not money or status. Wealth is having assets that earn while you sleep." },
        { tag: "Leverage", cn: "给我一根足够长的杠杆和支点，我就能撬动地球。现代的杠杆是：代码、媒体和资本。", en: "Fortunes require leverage. Business leverage comes from capital, people, and products with no marginal cost of replication." },
        { tag: "Career", cn: "在这个时代，你应该根据自己的“独特性”来赚钱，而不是根据“劳动”来赚钱。", en: "You get paid for being unique, not for labor." },
        { tag: "Specific Knowledge", cn: "专长（Specific Knowledge）是无法通过培训获得的。如果社会可以培训你，那么它也可以培训别人来取代你。", en: "Specific knowledge cannot be taught, but it can be learned." },
        { tag: "Compounding", cn: "生活中所有的回报，无论是财富、人际关系还是知识，都来自复利。", en: "All returns in life, whether in wealth, relationships, or knowledge, come from compound interest." },
        { tag: "Equity", cn: "如果你不拥有企业的所有权，你就很难通过出卖时间致富。", en: "You're not going to get rich renting out your time. You must own equity." },
        { tag: "Business", cn: "把自己产品化。", en: "Productize yourself." },
        { tag: "Money", cn: "金钱是我们转移财富的方式。金钱是社会的信用符号。", en: "Money is how we transfer wealth. Money is social credits." },
        { tag: "Risk", cn: "你要敢于以个人名义承担风险。社会将以责任、股权和杠杆来回报你。", en: "Take accountability. Society will reward you with responsibility, equity, and leverage." },
        
        // 判断力与决策
        { tag: "Judgment", cn: "努力工作的价值被高估了，而判断力的价值被低估了。方向比速度更重要。", en: "Hard work is overrated. Judgment is underrated. Direction matters more than speed." },
        { tag: "Wisdom", cn: "智慧就是知道长期来看什么对自己有益，并能够当下就去做。", en: "Wisdom is knowing the long term consequences of your actions." },
        { tag: "Truth", cn: "我们要追求的是真相，而不是让自己感觉舒服。", en: "The goal is to find the truth, not to be comfortable." },
        { tag: "Clear Thinking", cn: "清晰的思考需要独处。如果你总是忙碌，你就没有时间思考。", en: "Clear thinking requires solitude. If you are always busy, you are not thinking." },
        { tag: "Models", cn: "不要只读新闻，要读基础原理。基础原理是理解世界的思维模型。", en: "Read the basics. Read the classics. Read the foundation." },
        
        // 幸福与心态
        { tag: "Happiness", cn: "幸福不是一种与生俱来的特质，而是一种可以通过练习获得的技能。", en: "Happiness is a skill, just like keeping fit or making money." },
        { tag: "Desire", cn: "欲望就是你跟自己签订的合约：在得到你想要的东西之前，保持不快乐。", en: "Desire is a contract that you make with yourself to be unhappy until you get what you want." },
        { tag: "Envy", cn: "嫉妒是幸福的敌人。当你嫉妒别人时，你只是想拥有他们的某一方面，而不是他们整个人生。", en: "Envy is the enemy of happiness." },
        { tag: "Present", cn: "所有的焦虑都来自对未来的担忧，所有的悔恨都来自对过去的纠结。只有当下是真实的。", en: "All anxiety comes from living in the future. All regret comes from living in the past." },
        { tag: "Expectations", cn: "幸福等于现实减去期望。", en: "Happiness = Reality - Expectations." },
        { tag: "Peace", cn: "焦虑就是你大脑在处理过多未解决的问题。当你的思维停下来时，焦虑就消失了。", en: "Anxiety is a series of running thoughts. Peace is a clear mind." },
        { tag: "Retirement", cn: "退休不是年龄到了，而是当你不再为了想象中的明天而牺牲今天时，你就退休了。", en: "Retirement starts when you stop sacrificing today for an imaginary tomorrow." },
        
        // 自我提升与习惯
        { tag: "Health", cn: "健康的身体，平静的心灵，充满爱的家。这些东西是用钱买不到的。", en: "A fit body, a calm mind, a house full of love. These things cannot be bought." },
        { tag: "Habits", cn: "无论是锻炼、冥想还是阅读，每天坚持做一点，好过偶尔做很多。", en: "Consistency matters more than intensity." },
        { tag: "Validation", cn: "如果你想获得内心的平静，就不要去寻求外界的认可。", en: "If you want peace, stop seeking validation." },
        { tag: "Freedom", cn: "自由不是为了做你想做的事，而是为了不做你不想做的事。", en: "Freedom is the ability to do what you want, when you want, with who you want." },
        { tag: "Reading", cn: "阅读是精神的食粮。读那些你真正感兴趣的书，直到你爱上阅读。", en: "Read what you love until you love to read." },
        { tag: "Anger", cn: "愤怒就像手里握着一块烧红的煤炭想扔向别人，最终烫伤的是你自己。", en: "Anger is a hot coal you hold in your hand while waiting to throw it at someone else." },
        { tag: "Choices", cn: "简单的选择，艰难的生活。艰难的选择，简单的生活。", en: "Easy choices, hard life. Hard choices, easy life." },
        { tag: "Time", cn: "珍惜你的时间。给你的时间设定一个高昂的时薪，任何低于这个价值的事情都不要亲自做。", en: "Value your time at an hourly rate and ruthlessly decline anything that doesn't meet it." },
        
        // 哲学与反思
        { tag: "Life", cn: "这就是你唯一的人生。不要把它浪费在让别人开心上。", en: "This is the only life you have. Do not waste it making others happy." },
        { tag: "Death", cn: "时刻记住你会死，这会让你专注于真正重要的事情。", en: "Memento Mori. Remember you will die." },
        { tag: "Solitude", cn: "如果你不能平静地独处，你就无法看清真相。", en: "You have to be able to sit quietly in a room alone." },
        { tag: "Values", cn: "不要和那些有着你不认同的价值观的人做生意。", en: "Don't do business with people who don't share your values." },
        { tag: "Growth", cn: "如果你现在不觉得自己一年前是个傻瓜，那你这一年就没学到什么东西。", en: "If you don't look back at yourself a year ago and think you were an idiot, you haven't learned much." },
        { tag: "Education", cn: "自学是唯一的学习方式。学校只是在教你顺从。", en: "Self-education is the only kind of education there is." },
        { tag: "Luck", cn: "创造你自己的运气。通过行动、忙碌和独特性，让运气找到你。", en: "Make your own luck." },
        { tag: "Patience", cn: "急躁是智慧的敌人。", en: "Impatience with actions, patience with results." },
        { tag: "Comparison", cn: "不要和任何人比较。你在玩单机游戏。", en: "Life is a single-player game." },
        { tag: "Status", cn: "地位游戏是零和游戏。要玩正和游戏（财富创造）。", en: "Ignore status games. Play wealth games." },
        { tag: "Action", cn: "灵感是廉价的，行动才是昂贵的。", en: "Inspiration is perishable - act on it immediately." },
        { tag: "Meaning", cn: "生命的意义就是你赋予它的意义。", en: "The meaning of life is whatever you ascribe it to be." },
        { tag: "Authenticity", cn: "做自己。没有竞争对手，因为没人能比你更像你。", en: "Escape competition through authenticity." },
        { tag: "Problem Solving", cn: "如果不解决问题，问题就会解决你。", en: "If you don't solve the problem, the problem will solve you." },
        { tag: "Silence", cn: "大多数时候，沉默是最好的回答。", en: "Silence is often the best answer." },
        { tag: "Meditation", cn: "冥想不是一种行为，而是一种状态。", en: "Meditation is turning off the mind." },
        { tag: "Ego", cn: "你的自我是阻碍你看到真相的屏障。", en: "Your ego is the enemy." },
        { tag: "Learning", cn: "最聪明的人是那些问最多问题的人。", en: "The smartest people are the ones who ask the most questions." },
        { tag: "Focus", cn: "一次只做一件事。全神贯注。", en: "Focus on one thing at a time." },
        { tag: "Kindness", cn: "善良不是软弱，而是一种选择。", en: "Kindness is a choice." }
    ];

    // 全局索引变量
    let currentIndex = 0;
    const cardElement = document.getElementById('main-card');

    // 1. 初始化：计算今天的“默认金句”
    function init() {
        const now = new Date();
        const hour = now.getHours();
        const date = now.getDate();
        
        // 算法：(日期+小时) % 总数，保证每天每小时都不一样
        const seed = date + hour; 
        currentIndex = seed % navalLibrary.length;
        
        render(false); // false 表示不需要淡入动画，直接显示
    }

    // 2. 渲染函数：把内容放到屏幕上
    function render(animate = true) {
        // 如果需要动画，先让卡片隐身
        if (animate) {
            cardElement.style.opacity = 0;
            cardElement.style.transform = "translateY(5px)";
        }

        setTimeout(() => {
            const content = navalLibrary[currentIndex];
            
            // 更新文字
            // 显示当前卡片编号 (e.g. #05 / 50) 让用户知道位置
            const displayIndex = (currentIndex + 1).toString().padStart(2, '0');
            document.getElementById('card-index').innerText = `# ${displayIndex} / ${navalLibrary.length}`;
            document.getElementById('category').innerText = content.tag;
            document.getElementById('cn-text').innerText = content.cn;
            document.getElementById('en-text').innerText = content.en;

            // 恢复显示
            if (animate) {
                cardElement.style.opacity = 1;
                cardElement.style.transform = "translateY(0)";
            }
        }, animate ? 200 : 0);
    }

    // 3. 下一张
    function nextCard() {
        currentIndex++;
        // 如果到了最后一张，循环回到第一张
        if (currentIndex >= navalLibrary.length) {
            currentIndex = 0;
        }
        render(true);
    }

    // 4. 上一张
    function prevCard() {
        currentIndex--;
        // 如果到了第一张之前，循环回到最后一张
        if (currentIndex < 0) {
            currentIndex = navalLibrary.length - 1;
        }
        render(true);
    }

    // 键盘左右键支持
    document.addEventListener('keydown', function(event) {
        if (event.key === "ArrowRight") nextCard();
        if (event.key === "ArrowLeft") prevCard();
    });

    // 启动！
    init();
</script>

</body>
</html>
